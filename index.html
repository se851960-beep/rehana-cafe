function go(id){location.hash='/'+id;scrollTo({top:0,behavior:'smooth'});$('#mobile').classList.remove('open')}function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),3000)}function cartCount(){return cartItems.reduce((n,x)=>n+(x.qty||1),0)}function add(n,qty=1){qty=Math.max(1,Math.min(99,Number(qty)||1));let item=items.find(x=>x[0]===n),price=item?item[2]:0,existing=cartItems.find(x=>x.name===n&&x.price===price);if(existing)existing.qty=(existing.qty||1)+qty;else cartItems.push({name:n,price,qty});cart=cartCount();$('#count').textContent=cart;toast(`اتضاف ${n}${qty>1?' × '+qty+' قطع':''} للسلة`)}function productQtyControl(i){return `<div class="product-quantity"><label for="product-qty-${i}">عدد القطع</label><div class="quantity-stepper"><button type="button" onclick="stepProductQty(${i},-1)" aria-label="قلل العدد">−</button><input id="product-qty-${i}" type="number" min="1" max="99" value="1" inputmode="numeric" aria-label="عدد القطع" onchange="normalizeProductQty(${i})"><button type="button" onclick="stepProductQty(${i},1)" aria-label="زود العدد">+</button></div></div>`}function normalizeProductQty(i){let el=document.getElementById('product-qty-'+i);if(el)el.value=Math.max(1,Math.min(99,Number(el.value)||1))}function stepProductQty(i,delta){let el=document.getElementById('product-qty-'+i);if(el){el.value=Math.max(1,Math.min(99,(Number(el.value)||1)+delta))}}function addSelectedProduct(i){let el=document.getElementById('product-qty-'+i),qty=Math.max(1,Math.min(99,Number(el?.value)||1));add(items[i][0],qty);if(el)el.value=1}function product(p){let i=items.indexOf(p),href=`#/product/${i}`;return `<article class="card"><a class="product-photo-link" href="${href}" aria-label="اعرف تفاصيل ${p[0]}"><div class="photo"><img loading="lazy" src="${src(p[4])}" alt="${p[0]}"><span class="tag">${p[5]}</span></div></a><div class="info"><a class="product-name-link" href="${href}"><h3>${p[0]}</h3></a><p>${p[1]}</p><div class="foot"><b class="price">${p[2]} ج.م</b></div>${productQtyControl(i)}<button type="button" class="btn card-add" onclick="addSelectedProduct(${i})" aria-label="أضف ${p[0]} للسلة">أضف للسلة</button><a class="product-details-link" href="${href}">تفاصيل المنتج ←</a></div></article>`}function head(title,desc){return `<div class="page-head"><div class="headbox"><div><span class="eyebrow">ريحانة</span><h1>${title}</h1><p>${desc}</p></div></div></div>`}function title(t,d,l='menu',lt='شوف المنيو كله'){return `<div class="title"><div><span class="eyebrow">من مطبخ ريحانة</span><h2>${t}</h2><p>${d}</p></div><a class="link" href="#/${l}">${lt} ←</a></div>`}
function previewReviewPhotos(input){let out=$('#reviewPreview');if(!out)return;out.innerHTML=Array.from(input.files||[]).slice(0,3).filter(f=>f.type.startsWith('image/')).map(f=>`<img src="${URL.createObjectURL(f)}" alt="معاينة صورة من زيارة ريحانة">`).join('')}
function home(){return `<section class="hero"><div class="hero-box"><div class="hero-copy"><h1>لحظتك الحلوة<br>بتبدأ من هنا</h1><p>قهوة مظبوطة، حلوى من الفرن، وقعدة تجمع أحلى الناس.</p><div class="hero-cta"><button class="btn alt" onclick="go('menu')">اكتشف المنيو ←</button></div></div><div class="hero-visual hero-collage"><img class="collage-main" src="assets/cafe-table.webp" alt="تجهيز حلو في ريحانة"><img class="collage-top" src="assets/cafe-lounge.webp" alt="ركن دافئ في الكافيه"><img class="collage-bottom" src="assets/dessert-table.webp" alt="قهوة وحلوى من ريحانة"></div></div></section><section class="section tight"><div class="booking-grid"><article class="booking-card"><div class="booking-photo"><img src="assets/table-booking.webp" alt="جلسة هادئة في ريحانة حول الترابيزة" loading="lazy"></div><div class="booking-content"><span class="eyebrow">قعدة ريحانة</span><h2>احجز ترابيزتك</h2><p>اختار الفرع والميعاد وعدد الأفراد، وسيجهز لك فريق ريحانة قعدتك.</p><button class="btn" onclick="go('tables')">احجز ترابيزتك ←</button></div></article><article class="booking-card"><div class="booking-photo"><img src="assets/occasion-booking.webp" alt="تجهيز مناسبة على طاولة مزينة بالورد وكعكة" loading="lazy"></div><div class="booking-content"><span class="eyebrow">مناسبتك على ذوقك</span><h2>احجز مناسبتك</h2><p>من التورتة وتفاصيل الورد لضيافة يومك، شاركنا فكرتك وسيكمل فريق ريحانة الباقي.</p><button class="btn" onclick="go('celebrate')">خطط لمناسبتك ←</button></div></article></div></section><section class="section">${title('اختيارات بتحبها','لقمة حلوة ومشروب يظبط يومك')}<div class="grid">${items.slice(0,4).map(product).join('')}</div></section><section class="section">${title('أجواء ريحانة.. مكانك للهدوء واللقاء','شوف جلسات ريحانة وتفاصيل المكان، واختار الفرع اللي يناسب زيارتك.','gallery','شوف الجولة')}<div class="two"><div class="feature"><img src="assets/cafe-lounge.webp" alt="جلسة ريحانة بين النباتات والديكورات الخشبية"></div><div class="copy"><span class="eyebrow">مكان على مزاجك</span><h2>خد نفس…<br>إنت في ريحانة</h2><p>سواء قعدة قهوة سريعة أو يوم طويل مع صحابك، جهزنالك مساحة مريحة بطابع أخضر دافي.</p><button class="btn alt" onclick="go('branches')">اعرف أقرب فرع</button></div></div></section> `}
function reviewCard(r){return `<article class="review-card"><div class="review-stars" aria-label="تقييم ${r.rating} من ٥">${r.rating} / ٥</div><p>${r.text}</p>${r.photos&&r.photos.length?`<div class="review-photos">${r.photos.map(x=>`<img src="${x}" alt="صورة مرفقة بتجربة زائر">`).join('')}</div>`:''}<div class="review-person"><b>${r.name}</b><small>شارك تجربته</small></div></article>`}
function reviews(){let local=[];try{local=JSON.parse(localStorage.getItem('rehanaReviews')||'[]')}catch{}return `${head('لحظات ريحانة','احكِ عن زيارتك، وشوف لحظات أصحاب ريحانة في الفروع.')}<section class="section"><div class="reviews-intro"><div><span class="eyebrow">كلام من القلب</span><h2>كل تجربة ليها حكاية</h2><p>شارك تقييمك وصورة من زيارتك.</p></div><button class="btn" type="button" onclick="document.getElementById('reviewForm').scrollIntoView({behavior:'smooth'})">شارك تجربتك ←</button></div>${local.length?`<div class="reviews-grid">${local.map(reviewCard).join('')}</div>`:`<div class="review-empty"><h2>لسه مستنيين لحظتك</h2><p>خليك أول واحد يشارك رأيه وصورته من ريحانة.</p><button class="btn alt" onclick="document.getElementById('reviewForm').scrollIntoView({behavior:'smooth'})">ابدأ مشاركتك ←</button></div>`}<div class="review-submit"><div><span class="eyebrow">دورك تحكي</span><h2>شاركنا تجربتك في ريحانة</h2><p>اكتب رأيك وارفع صور من زيارتك — تقدر ترفق حتى ٣ صور.</p></div><form class="form review-form" id="reviewForm"><div class="row"><div class="field"><label>اسمك</label><input name="reviewName" required placeholder="اكتب اسمك"></div><div class="field"><label>تقييمك للمكان</label><select name="reviewRating" required><option value="">اختار عدد النجوم</option><option value="5">٥ نجوم</option><option value="4">٤ نجوم</option><option value="3">٣ نجوم</option><option value="2">نجمتان</option><option value="1">نجمة واحدة</option></select></div></div><div class="field"><label>احكيلنا عن تجربتك</label><textarea name="reviewText" required placeholder="إيه أكتر حاجة عجبتك في زيارتك؟"></textarea></div><div class="field"><label>صور من زيارتك</label><input id="reviewPhotos" name="reviewPhotos" type="file" accept="image/*" multiple><div id="reviewPreview" class="review-preview"></div></div><button class="btn">انشر تقييمك ←</button></form></div></section>`}
function compressReviewImage(file){return new Promise(resolve=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,700/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.65))};img.onerror=()=>{URL.revokeObjectURL(url);resolve('')};img.src=url})}
async function saveReview(e){e.preventDefault();let f=e.target,photos=[...($('#reviewPhotos').files||[])].slice(0,3),r={name:f.elements.reviewName.value.trim(),rating:Number(f.elements.reviewRating.value),text:f.elements.reviewText.value.trim(),photos:(await Promise.all(photos.map(compressReviewImage))).filter(Boolean),sample:false,date:new Date().toISOString()};let old=[];try{old=JSON.parse(localStorage.getItem('rehanaReviews')||'[]')}catch{};try{localStorage.setItem('rehanaReviews',JSON.stringify([r,...old].slice(0,30)))}catch{r.photos=[];try{localStorage.setItem('rehanaReviews',JSON.stringify([r,...old].slice(0,30)))}catch{toast('تعذر حفظ الصور. قلل عدد الصور أو حجمها ثم أعد المحاولة.');return}}draw();toast('شكرًا لمشاركة لحظتك مع ريحانة.')}
function pairing(p){let ix=items.indexOf(p);let choice=(ix===5||ix===1)?items[3]:ix===0?items[7]:items[0],choiceIndex=items.indexOf(choice);let reason=(ix===5||ix===1)?'قهوة متوازنة تكمل حلاوة الفاكهة والكريمة.':ix===0?'فطور ريحانة يجمع الكرواسون مع قهوة اليوم.':'مخبوزة طازة تكمل اختيارك.';return `<aside class="pairing-card"><div class="pairing-product"><div class="pairing-photo"><img src="${src(choice[4])}" alt="${choice[0]}" loading="lazy"></div><div class="pairing-info"><span class="eyebrow">ترشيح ريحانة</span><h3>يكتمل الطعم مع.. ${choice[0]}</h3><p>${choice[1]} — ${reason}</p><b>${choice[2]} ج.م</b>${productQtyControl(choiceIndex)}</div></div><button class="btn sm pairing-add" onclick="addSelectedProduct(${choiceIndex})">أضف للسلة</button></aside>`}
function productDetail(){let i=Number(location.hash.split('/').pop()),p=items[i];if(!p){go('menu');return ''}return `${head(p[0],'تفاصيل المنتج من منيو ريحانة.','✿')}<section class="section"><div class="two"><div class="feature" style="background:#fff"><img src="${src(p[4])}" alt="${p[0]}" style="object-fit:contain;padding:18px"></div><div class="copy"><span class="eyebrow">${p[5]}</span><h2>${p[0]}</h2><p>${p[1]}</p><div class="stats"><div><b>${p[2]} ج.م</b><small>السعر</small></div><div><b>${p[3]}</b><small>القسم</small></div></div><div class="product-detail-actions">${productQtyControl(i)}<button type="button" class="btn detail-add" onclick="addSelectedProduct(${i})">أضف للسلة</button></div><button type="button" class="btn alt" onclick="go('menu')">ارجع للمنيو</button>${pairing(p)}</div></div></section>`}
function categoryOptions(scope){return scope==='desserts'?['الكل','حلويات','بوكسات','فطور']:scope==='drinks'?['الكل','مشروبات']:['الكل','حلويات','مشروبات','فطور','بوكسات']}
function productType(item){if(item[3]==='مشروبات')return 'مشروب';if(item[3]==='بوكسات')return 'بوكس للمشاركة';if(item[3]==='فطور')return 'فطور';return item[0].includes('كرواسون')||item[0].includes('كوكيز')?'مخبوزات':'حلويات'}
function filteredProducts(scope='menu'){let list=scope==='drinks'?items.filter(x=>x[3]==='مشروبات'):scope==='desserts'?items.filter(x=>['حلويات','بوكسات','فطور'].includes(x[3])):[...items],cats=categoryOptions(scope),selectedCategory=cats.includes(filter)?filter:'الكل';if(selectedCategory!=='الكل')list=list.filter(x=>x[3]===selectedCategory);if(moodFilter!=='الكل'){let moodMap={'الأكثر مبيعًا':[0],'فطور صباحي':[0,3,7],'بدون سكر مضاف':[3],'يكفي لمة':[6]};list=list.filter(x=>(moodMap[moodFilter]||[]).includes(items.indexOf(x)))}if(priceFilter==='حتى ٧٥')list=list.filter(x=>x[2]<=75);else if(priceFilter==='٧٦–١٢٠')list=list.filter(x=>x[2]>=76&&x[2]<=120);else if(priceFilter==='أكثر من ١٢٠')list=list.filter(x=>x[2]>120);if(typeFilter!=='الكل')list=list.filter(x=>productType(x)===typeFilter);if(availabilityFilter==='متاح للطلب')list=list.filter(x=>items.includes(x));if(sortFilter==='السعر الأقل')list.sort((a,b)=>a[2]-b[2]);else if(sortFilter==='السعر الأعلى')list.sort((a,b)=>b[2]-a[2]);return list}
function setCatalogFilter(key,value){if(key==='category')filter=value;else if(key==='price')priceFilter=value;else if(key==='type')typeFilter=value;else if(key==='mood')moodFilter=value;else if(key==='sort')sortFilter=value;else if(key==='availability')availabilityFilter=value;draw()}

function loyalty(){let member=customerData();let levels=[['برونزي','ابدأ رحلتك مع ريحانة ومكافآت الزيارات.'],['فضي','مكافآت إضافية مع تكرار زياراتك.'],['ذهبي','مزايا خاصة وتجربة أصناف جديدة.']];return `${head('برنامج ريحانة للولاء','كل زيارة تقرّبك من مكافأة حلوة. تابع عضويتك واجعل لحظاتك أحلى.','♡')}<section class="section"><div class="loyalty-hero"><article class="loyalty-pass"><div><span class="eyebrow">عضوية ريحانة</span><h2>${member?`أهلاً يا ${escapeHTML(member.name)}`:'لحظاتك الحلوة تستاهل مكافأة'}</h2><span>${member?'عضو في برنامج ريحانة':'انضم لبرنامج ريحانة'}</span></div><div class="loyalty-points"><strong>٠</strong><small>نقاطك الحالية</small></div></article><article class="loyalty-welcome"><span class="eyebrow">مكافآت على ذوقك</span><h2>${member?'تابع عضويتك':'ابدأ جمع النقاط'}</h2><p>سجّل بياناتك لتسهيل حجوزاتك وربط زياراتك بحسابك.</p><a class="btn" href="#/account">${member?'حدّث بياناتك':'سجّل كعميل'} ←</a><a class="link" style="margin-top:12px" href="#/branches">اعرف أقرب فرع ←</a></article></div><div class="tier-grid">${levels.map((x,i)=>`<article class="tier-card ${i===0?'active':''}"><small>مستوى ${['الأول','الثاني','الثالث'][i]}</small><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')}</div><div class="loyalty-note">اسأل فريق الفرع عن تسجيل زيارتك ومكافآتك المتاحة، وتواصل معنا لتأكيد تفاصيل العضوية.</div></section>`}

function experiences(){let cards=[['experiences/pickup.svg','استلام من السيارة','اطلب من الموقع وحدد الفرع ورقم سيارتك.','checkout','ابدأ الطلب'],['experiences/fresh.svg','تنبيه المخبوزات الطازة','سجّل اهتمامك بمواعيد خروج المخبوزات.','fresh'],['experiences/corporate.svg','بوكسات الشركات','ضيافة اجتماعات تناسب ٦–٨ أفراد.','corporate'],['experiences/subscription.svg','اشتراك القهوة','باقة قهوة ومخبوزات متكررة تناسب زياراتك.','subscription'],['experiences/buildbox.svg','كوّن بوكسك','اختار ٦ أو ١٢ قطعة واكتب رسالة الإهداء.','buildbox'],['experiences/pantry.svg','ركن ريحانة للبيت','اكتشف أفكار منتجات ريحانة المنزلية.','pantry'],['experiences/workshop.svg','ورش تزيين الحلويات','سجّل اهتمامك بورش نهاية الأسبوع.','workshops'],['experiences/baking.svg','مسرح الخَبز الحي','شاهد مراحل تجهيز وتزيين الحلويات داخل الفرع.','baking']];return `${head('تجارب ريحانة','خدمات وأفكار تخلي زيارتك وطلبك أسهل وألذ.')}<section class="section"><div class="service-grid">${cards.map(c=>experienceCard(...c)).join('')}</div></section>`}
function customerData(){try{return JSON.parse(localStorage.getItem('rehanaCustomer')||'null')}catch{return null}}function escapeHTML(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function account(){let c=customerData()||{};return `${head('حسابك في ريحانة','سجّل بياناتك لتسهيل حجوزاتك ومتابعة عضويتك.')}<section class="section contact"><aside class="contact-info"><span class="eyebrow">أهلاً بك في ريحانة</span><h2>حسابك يجمع<br>لحظاتك الحلوة</h2><p>احفظ بياناتك مرة واحدة، واستكشف برنامج الولاء ومكافآت زياراتك.</p><a class="btn alt" href="#/loyalty">شوف برنامج الولاء</a></aside><form class="form" id="accountForm"><h2>${c.name?'بيانات حسابك':'سجّل كعميل جديد'}</h2><div class="field"><label>الاسم</label><input name="name" required autocomplete="name" placeholder="اكتب اسمك" value="${escapeHTML(c.name)}"></div><div class="field"><label>رقم الموبايل</label><input name="phone" required type="tel" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx" value="${escapeHTML(c.phone)}"></div><div class="field"><label>البريد الإلكتروني</label><input name="email" required type="email" autocomplete="email" placeholder="name@example.com" value="${escapeHTML(c.email)}"></div><button class="btn" type="submit">${c.name?'احفظ بياناتي':'أنشئ حسابك'} ←</button></form></section>`}function saveCustomer(e){e.preventDefault();let f=e.currentTarget,c={name:f.elements.name.value.trim(),phone:f.elements.phone.value.trim(),email:f.elements.email.value.trim()};localStorage.setItem('rehanaCustomer',JSON.stringify(c));toast('تم حفظ بيانات حسابك.');draw()}
function checkout(){if(!cartItems.length)return `${head('سلتك','ابدأ باختيار حاجتك من المنيو، وبعدها اختار طريقة الاستلام.','✦')}<section class="section empty-cart"><div class="empty-cart-mark" aria-hidden="true"><svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg></div><h2>السلة لسه فاضية</h2><p>اختار قهوتك وحلوياتك، وارجع هنا لإكمال طلبك.</p><button class="btn" onclick="go('menu')">روح للمنيو ←</button></section>`;let total=cartItems.reduce((n,x)=>n+x.price*(x.qty||1),0);return `${head('أكمل طلبك','اختار استلامك من الفرع أو من سيارتك.','✦')}<section class="section checkout-layout"><div class="form"><h2>طلبك</h2><div class="order-lines">${cartItems.map((x,i)=>`<div class="order-line"><span>${x.name}${(x.qty||1)>1?' × '+(x.qty||1)+' قطع':''}</span><b>${x.price?x.price*(x.qty||1)+' ج.م':'حسب الاختيار'}</b><button type="button" class="remove" onclick="removeCartItem(${i})" aria-label="حذف ${x.name}">×</button></div>`).join('')}</div><div class="order-total"><span>الإجمالي</span><b>${total} ج.م</b></div><div class="demo-note">مع طلبك، استمتع بقطعة ميني كوكيز وكارت خصم على القطعة الكاملة.</div></div><form class="form" id="checkoutForm"><h2>بيانات الاستلام</h2><div class="row"><div class="field"><label>الاسم</label><input required placeholder="اكتب اسمك"></div><div class="field"><label>رقم الموبايل</label><input required type="tel" placeholder="01xxxxxxxxx"></div></div><div class="field"><label>طريقة الاستلام</label><select id="pickupType"><option value="branch">استلام من الفرع</option><option value="car">استلام من السيارة</option></select></div><div class="field" id="carFields" hidden><label>رقم السيارة</label><input id="carNumber" placeholder="مثال: س أ ب ١٢٣٤"></div><div class="field"><label>الفرع</label><select><option>فرع بنها</option><option>فرع شبين الكوم — فينيسيا مول</option></select></div><div class="field"><label>طريقة الدفع</label><select><option>الدفع عند الاستلام</option><option>بطاقة بنكية</option></select></div><div class="field"><label>ملاحظات للطلب</label><textarea placeholder="أي تفاصيل تساعدنا نجهز طلبك"></textarea></div><button class="btn">تأكيد الطلب ←</button></form></section>`}
function removeCartItem(i){cartItems.splice(i,1);cart=cartCount();$('#count').textContent=cart;draw()}

function corporate(){return `${head('بوكسات الاجتماعات والشركات','ضيافة مرتبة للاجتماعات، فرق العمل واللّمات العائلية.','ش')}<section class="section"><div class="corporate-boxes"><article><span>٦–٨ أفراد</span><h2>بوكس قهوة الصباح</h2><p>ميني كرواسون، ميني تارت، وقهوة كبيرة للمشاركة.</p></article><article><span>حسب عدد الضيوف</span><h2>ضيافة على مقاسك</h2><p>اختار التشكيلة والعدد وميعاد التوصيل أو الاستلام.</p></article></div><div class="section contact"><div class="copy"><span class="eyebrow">للشركات والتجمعات</span><h2>اجتماعك يبدأ بضيافة حلوة</h2><p>ابعت التفاصيل الأولية وسيجهز فريق ريحانة تصورًا مناسبًا. محتوى البوكس والسعر والتوصيل يحتاج تأكيدًا من الفرع.</p><div class="stats"><div><b>ميني كرواسون</b><small>طازة للّمة</small></div><div><b>ميني تارت</b><small>تشكيلة مشاركة</small></div><div><b>قهوة كبيرة</b><small>تكفي المجموعة</small></div></div></div><form class="form" id="corporateForm"><h2>اطلب بوكس شركة</h2><div class="row"><div class="field"><label>اسم الشركة</label><input required placeholder="اسم الشركة"></div><div class="field"><label>اسم المسؤول</label><input required placeholder="اسمك"></div></div><div class="row"><div class="field"><label>رقم الموبايل</label><input required type="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label>عدد الأفراد</label><input type="number" min="1" value="8" required placeholder="اكتب العدد المتوقع"></div></div><div class="row"><div class="field"><label>التاريخ المطلوب</label><input required type="date"></div><div class="field"><label>الفرع</label><select><option>بنها</option><option>شبين الكوم</option></select></div></div><div class="field"><label>تفاصيل إضافية</label><textarea placeholder="الميزانية أو مكونات مفضلة"></textarea></div><button class="btn">اطلب عرض سعر ←</button></form></div></section>`}
function subscription(){return `${head('اشتراك القهوة والكرواسون','اختار باقة شهرية مرنة تناسب زياراتك وتجمع قهوتك ومخبوزاتك المفضلة.','ق')}<section class="section"><div class="service-grid two-plans"><article class="feature-card plan"><span class="service-icon">ق</span><span class="eyebrow">باقة أيام العمل</span><h2>قهوة + مخبوزة</h2><p>مشروب ومخبوزة في زيارات أيام العمل، مع تسجيل الزيارة عند الاستلام.</p><button class="btn" onclick="document.querySelector('#subscriptionForm').scrollIntoView({behavior:'smooth'})">سجّل اهتمامك ←</button></article><article class="feature-card plan"><span class="service-icon">ق</span><span class="eyebrow">باقة الزيارات</span><h2>اختار أيامك</h2><p>رصيد زيارات شهري تستخدمه في الوقت اللي يناسبك.</p><button class="btn alt" onclick="document.querySelector('#subscriptionForm').scrollIntoView({behavior:'smooth'})">اعرف التفاصيل ←</button></article></div><form class="form interest-form" id="subscriptionForm"><h2>سجّل اهتمامك بالاشتراك</h2><div class="row"><div class="field"><label>الاسم</label><input required placeholder="اكتب اسمك"></div><div class="field"><label>رقم الموبايل</label><input required type="tel" placeholder="01xxxxxxxxx"></div></div><div class="field"><label>الباقة اللي تهمك</label><select><option>قهوة + مخبوزة في أيام العمل</option><option>رصيد زيارات شهري</option></select></div><button class="btn">سجّل اهتمامك ←</button></form></section>`}
function buildbox(){boxPicks={};return `${head('كوّن بوكسك','اختار ٦ أو ١٢ قطعة ميني، وشوف بوكسك بيتكوّن قدامك.','✦')}<section class="section"><div class="box-builder"><div class="box-size"><button class="filter sel" id="size6" onclick="setBoxLimit(6)">بوكس ٦ قطع</button><button class="filter" id="size12" onclick="setBoxLimit(12)">بوكس ١٢ قطعة</button><span>ضيف القطع واحدة واحدة لحد ما البوكس يكمل.</span></div><div class="box-builder-layout"><div class="box-options"></div><aside class="box-preview"><span class="eyebrow">بوكسك بيتجهز</span><div class="box-stage"></div><b id="boxCount">٠ من ٦ قطع</b><p>اكتب رسالة على كارت الإهداء.</p><textarea id="giftMessage" maxlength="120" placeholder="كل سنة وأنت طيب…"></textarea><button class="btn" id="addBoxButton" onclick="addBuildBox()" disabled>أضف البوكس للسلة</button></aside></div></div></section>`}
function setBoxLimit(n){boxLimit=n;boxPicks={};renderBoxOptions()}
function changeBoxQty(i,d){let count=Object.values(boxPicks).reduce((a,b)=>a+b,0);let next=(boxPicks[i]||0)+d;if(next<0|| (d>0&&count>=boxLimit))return;boxPicks[i]=next;renderBoxOptions()}
function renderBoxOptions(){let el=$('.box-options');if(!el)return;el.innerHTML=miniOptions.map((x,i)=>`<div class="pick-option"><div class="mini-label"><span>${x[1]}</span><div><b>${x[0]}</b><small>${x[2]}</small></div></div><div class="counter"><button onclick="changeBoxQty(${i},-1)" aria-label="قلل ${x[0]}">−</button><b>${boxPicks[i]||0}</b><button onclick="changeBoxQty(${i},1)" aria-label="زود ${x[0]}">+</button></div></div>`).join('');let count=Object.values(boxPicks).reduce((a,b)=>a+b,0),flat=Object.entries(boxPicks).flatMap(([i,q])=>Array(q).fill(Number(i)));$('.box-stage').innerHTML=Array.from({length:boxLimit},(_,i)=>{let item=miniOptions[flat[i]];return `<div class="box-slot ${item?'filled':''}"><span>${item?item[1]:'＋'}</span><small>${item?item[0]:'اختار قطعة'}</small></div>`}).join('');$('#boxCount').textContent=`${count} من ${boxLimit} قطع`;$('#addBoxButton').disabled=count!==boxLimit;$('#size6').classList.toggle('sel',boxLimit===6);$('#size12').classList.toggle('sel',boxLimit===12)}
function addBuildBox(){let count=Object.values(boxPicks).reduce((a,b)=>a+b,0);if(count!==boxLimit){toast(`اختار ${boxLimit} قطع الأول`);return}let detail=Object.entries(boxPicks).filter(x=>x[1]).map(([i,q])=>`${miniOptions[Number(i)][0]} × ${q}`).join('، '),message=$('#giftMessage').value.trim();cartItems.push({name:`بوكس ${boxLimit} قطع: ${detail}${message?' | كارت: '+message:''}`,price:0,qty:1});cart=cartCount();$('#count').textContent=cart;toast('اتضاف بوكسك للسلة — السعر يتأكد من ريحانة');go('checkout')}
function pantry(){let products=[['بن ريحانة','بن مختار للتحضير في البيت','ق'],['جرانولا المخبز','جرانولا محمصة للفطور','ج'],['مربى طبيعية','مربى موسمية بحبات فاكهة','م'],['زبدة الفستق','نفس اللمسة المستخدمة في حلويات ريحانة','ف'],['كراميل مملح','إضافة حلوة لقهوة البيت','ك']];return `${head('ركن ريحانة للبيت','منتجات من مطبخنا تكمل لحظاتك الحلوة في البيت.','م')}<section class="section"><div class="pantry-grid">${products.map(x=>`<article class="pantry-card"><span>${x[2]}</span><h3>${x[0]}</h3><p>${x[1]}</p><small>اختار منتج ريحانة للبيت</small></article>`).join('')}</div><form class="form interest-form" id="pantryForm"><h2>إيه المنتج اللي تحب تلاقيه؟</h2><div class="row"><div class="field"><label>اسمك</label><input required placeholder="اكتب اسمك"></div><div class="field"><label>رقم الموبايل أو البريد</label><input required placeholder="وسيلة التواصل"></div></div><div class="field"><label>اختار المنتج</label><select>${products.map(x=>`<option>${x[0]}</option>`).join('')}</select></div><button class="btn">سجّل اهتمامك ←</button></form></section>`}
function baking(){return `${head('مسرح الخَبز الحي','تفصيلة تخليك تشوف الحلو بيتجهز قدامك.','✿')}<section class="section two"><div class="copy"><span class="eyebrow">من الفرن للواجهة</span><h2>شوف التزيين…<br>واختار أول لقمة</h2><p>تصور لتجهيز نافذة زجاجية لمشاهدة تزيين التارت وخروج المخبوزات الطازة، مع مساحة تصوير لطيفة للزوار.</p><p>تابع مراحل تجهيز الحلويات خلال زيارتك للفرع.</p><button class="btn" onclick="go('branches')">اعرف الفروع ←</button></div><div class="feature"><img src="assets/cafe-floral-ceiling.webp" alt="أجواء فرع ريحانة"></div></section>`}
function workshops(){return `${head('ورش تزيين الكيك والتارت','اتعلم تفصيلة جديدة مع شيف ريحانة في تجربة حلوة للصغيرين والكبار.','و')}<section class="section"><div class="corporate-boxes"><article><span>ورشة نهاية الأسبوع</span><h2>تزيين التارت</h2><p>تجربة عملية للمبتدئين مع أدوات ومكونات الورشة.</p></article><article><span>للأطفال والعائلات</span><h2>كيكتك بإيدك</h2><p>مساحة صغيرة لتتعلم وتاخد شغلك معاك.</p></article></div><form class="form interest-form" id="workshopForm"><h2>سجّل اهتمامك بورشة</h2><div class="row"><div class="field"><label>الاسم</label><input required placeholder="اكتب اسمك"></div><div class="field"><label>رقم الموبايل</label><input required type="tel" placeholder="01xxxxxxxxx"></div></div><div class="row"><div class="field"><label>الورشة</label><select><option>تزيين التارت</option><option>تزيين الكيك</option><option>ورشة للأطفال</option></select></div><div class="field"><label>عدد المقاعد</label><select><option>مقعد واحد</option><option>مقعدان</option><option>٣ مقاعد أو أكثر</option></select></div></div><button class="btn">سجّل اهتمامك ←</button><p class="form-note">سيتواصل معك فريق ريحانة لتأكيد الموعد والتفاصيل.</p></form></section>`}
const views={home,menu,desserts,drinks,story,offers,events,reviews,gallery,branches,tables,celebrate,loyalty,account,contact,experiences,checkout,fresh,corporate,subscription,buildbox,pantry,baking,workshops,product:productDetail};function current(){let p=location.hash.replace('#/','').split('?')[0];if(/^product\/\d+$/.test(p))return 'product';return views[p]?p:'home'}function setFilter(f){filter=f;moodFilter='الكل';draw()}function setMoodFilter(f){moodFilter=f;draw()}function makeFormChoicesEditable(){document.querySelectorAll('form select:not(#pickupType):not([name="reviewRating"])').forEach((select,index)=>{let values=[...select.options].map(o=>o.textContent.trim()).filter(Boolean);if(!values.length)return;let input=document.createElement('input'),list=document.createElement('datalist'),id=`choice-list-${index}`;input.type='text';input.className=select.className;input.name=select.name||select.id||`choice-${index}`;input.value=select.value||values[0];input.placeholder='اختار من الاقتراحات أو اكتب اختيارك';input.setAttribute('list',id);input.setAttribute('aria-label',select.closest('.field')?.querySelector('label')?.textContent||'اختيار');list.id=id;values.forEach(value=>{let option=document.createElement('option');option.value=value;list.append(option)});let hint=document.createElement('small');hint.className='form-note editable-choice-note';hint.textContent='تقدر تختار اقتراح أو تكتب اختيارك.';select.replaceWith(input);input.after(list,hint)})}function draw(){let p=current();$('#app').innerHTML=`<div class="view">${views[p]()}</div>`;makeFormChoicesEditable();document.querySelectorAll('.nav a').forEach(x=>x.classList.toggle('on',x.dataset.page===p));document.querySelectorAll('.mobile a').forEach(x=>x.classList.toggle('on',x.dataset.page===p));$('#mobile').classList.remove('open');$('#accountLink').classList.toggle('on',p==='account');if(p==='buildbox')renderBoxOptions();if(p==='account')$('#accountForm').addEventListener('submit',saveCustomer);if(p==='reviews'){let photoInput=$('#reviewPhotos');photoInput.addEventListener('change',()=>previewReviewPhotos(photoInput));$('#reviewForm').addEventListener('submit',saveReview)}if(p==='checkout'&&cartItems.length){let pt=$('#pickupType'),cf=$('#carFields'),cn=$('#carNumber');pt.addEventListener('change',()=>{cf.hidden=pt.value!=='car';cn.required=pt.value==='car'});$('#checkoutForm').addEventListener('submit',e=>sendLeadToWhatsApp(e,`طلب استلام: ${cartItems.map(x=>x.name+((x.qty||1)>1?' × '+x.qty:'')).join('، ')}`))}if(p==='contact'){let f=$('#booking');f.insertAdjacentHTML('beforeend','<p class="form-note">بالضغط على الإرسال، هتفتح رسالة جاهزة على واتساب بالتفاصيل اللي كتبتها؛ راجعها واضغط إرسال.</p>');f.addEventListener('submit',e=>sendLeadToWhatsApp(e,'استفسار أو حجز'))}document.querySelectorAll('input[type=date]').forEach(x=>{let n=new Date();x.min=new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,10)});[['tables','tableForm','حجز ترابيزة'],['fresh','freshForm','التسجيل لتنبيه المخبوزات'],['corporate','corporateForm','طلب بوكس شركة'],['subscription','subscriptionForm','الاشتراك الشهري'],['pantry','pantryForm','اقتراح منتج من ركن البيت'],['workshops','workshopForm','حجز ورشة'],['celebrate','occasionForm','حجز مناسبة']].forEach(([page,id,subject])=>{if(p===page){let f=$('#'+id);f.insertAdjacentHTML('beforeend','<p class="form-note">بالضغط على الإرسال، هتفتح رسالة جاهزة على واتساب بالتفاصيل اللي كتبتها؛ راجعها واضغط إرسال.</p>');f.addEventListener('submit',e=>sendLeadToWhatsApp(e,subject))}})}

function sendLeadToWhatsApp(e,subject){e.preventDefault();let rows=[...e.target.querySelectorAll('.field')].map(f=>{let label=f.querySelector('label')?.textContent?.trim(),control=f.querySelector('input:not([type=file]),select,textarea'),value=control?.value?.trim();return label&&value?`• ${label}: ${value}`:''}).filter(Boolean);let text=`أهلًا ريحانة، عندي ${subject}.\n${rows.join('\n')}\nممكن أعرف التفاصيل والتأكيد؟`;let url=`https://wa.me/201044917876?text=${encodeURIComponent(text)}`;window.open(url,'_blank','noopener,noreferrer');toast('جهزنا رسالة لفريق ريحانة على واتساب.')}
function makeNav(){let mobilePages=pages.filter(([id])=>['home','menu','experiences','offers','reviews','events','tables','celebrate','branches','loyalty','account','gallery','contact'].includes(id));let html=mobilePages.map(([id,name])=>`<a href="#/${id}" data-page="${id}">${name}</a>`).join('');$('#nav').innerHTML=primary.map(([id,name])=>`<a href="#/${id}" data-page="${id}">${name}</a>`).join('');$('#mobile').innerHTML=html;$('#footer').innerHTML=`<section class="newsletter-banner"><div class="newsletter-copy"><span class="eyebrow">نشرة ريحانة</span><h2>خليك قريب من كل جديد</h2><p>اكتب بريدك الإلكتروني لتوصلك اختيارات ريحانة الجديدة وعروضها.</p></div><form class="newsletter-form" id="newsletter"><input required type="email" aria-label="البريد الإلكتروني للنشرة" placeholder="اكتب بريدك الإلكتروني"><button type="submit">اشترك بالنشرة</button></form></section><div class="fgrid"><div><div class="fbrand"><span class="footer-mark"><img src="assets/rehana-mark.png" alt=""><i class="logo-leaf" aria-hidden="true"></i></span><b>ريحانة<br><small>قهوة وحلويات</small></b></div><p>قهوة مظبوطة، حلويات طازة، ولمة بتخلي اليوم أحلى.</p></div><div><h4>المنيو والعروض</h4><a href="#/menu">المنيو الكامل</a><a href="#/desserts">الحلويات</a><a href="#/drinks">المشروبات</a><a href="#/offers">العروض</a><a href="#/fresh">من الفرن</a></div><div><h4>الزيارة والحجوزات</h4><a href="#/tables">احجز ترابيزتك</a><a href="#/celebrate">احجز مناسبتك</a><a href="#/events">المناسبات والورش</a><a href="#/gallery">جولة في المكان</a><a href="#/branches">الفروع</a></div><div><h4>خدمات ريحانة</h4><a href="#/experiences">كل التجارب</a><a href="#/loyalty">برنامج الولاء</a><a href="#/corporate">بوكسات الشركات</a><a href="#/subscription">اشتراك القهوة</a><a href="#/buildbox">كوّن بوكسك</a><a href="#/pantry">ركن البيت</a><a href="#/story">حكاية ريحانة</a></div><div><h4>تواصل ولحظات ريحانة</h4><a href="#/reviews">لحظات ريحانة</a><a href="#/contact">كلمنا</a><a class="footer-phone" href="tel:01044917876" dir="rtl">٠١٠ ٤٤٩١ ٧٨٧٦</a><a href="mailto:rehana.bakry@gmail.com">rehana.bakry@gmail.com</a><div class="social-links" aria-label="حسابات ريحانة على مواقع التواصل"><a class="social-icon" target="_blank" rel="noopener noreferrer" href="https://instagram.com/rehana.cafe" aria-label="إنستجرام ريحانة" title="إنستجرام ريحانة"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" class="social-dot"/></svg></a><a class="social-icon" target="_blank" rel="noopener noreferrer" href="https://www.facebook.com/rehana.banha" aria-label="فيسبوك ريحانة" title="فيسبوك ريحانة"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="social-fill" d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.2-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.2v2.3H7.6V13h2.7v8z"/></svg></a></div></div></div><div class="fbase"><span>© 2026 ريحانة</span><span>كل الحقوق محفوظة</span></div>`}$('#toggle').onclick=()=>$('#mobile').classList.toggle('open');$('#cart').onclick=()=>go('checkout');window.addEventListener('hashchange',draw);makeNav();draw();const searchDrawer=$('#searchDrawer'),searchToggle=$('#searchToggle'),searchInput=$('#siteSearch'),searchResults=$('#searchResults');function renderSearchResults(){let q=searchInput.value.trim().toLocaleLowerCase('ar');if(!q){searchResults.innerHTML='<p class="search-hint">اكتب اسم منتج أو نوعه للبحث في المنيو.</p>';return}let found=items.map((x,i)=>({x,i})).filter(({x})=>x.slice(0,2).join(' ').toLocaleLowerCase('ar').includes(q)||x[3].toLocaleLowerCase('ar').includes(q));searchResults.innerHTML=found.length?found.map(({x,i})=>`<article class="search-result"><a href="#/product/${i}"><img src="${src(x[4])}" alt="${escapeHTML(x[0])}"></a><a class="search-result-copy" href="#/product/${i}"><b>${escapeHTML(x[0])}</b><small>${escapeHTML(x[1])}</small></a><button class="plus" type="button" onclick="add('${x[0]}')"">${x[2]} ج.م · أضف للسلة</button></article>`).join(''):'<p class="search-hint">ملقيناش نتيجة مطابقة. جرّب كلمة تانية أو افتح المنيو الكامل.</p>'}searchToggle.addEventListener('click',()=>{let opening=searchDrawer.hidden;searchDrawer.hidden=!opening;searchToggle.setAttribute('aria-expanded',String(opening));if(opening){searchInput.focus();renderSearchResults()}});$('#searchClose').addEventListener('click',()=>{searchDrawer.hidden=true;searchToggle.setAttribute('aria-expanded','false')});searchInput.addEventListener('input',renderSearchResults);$('#searchForm').addEventListener('submit',e=>{e.preventDefault();renderSearchResults()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){searchDrawer.hidden=true;searchToggle.setAttribute('aria-expanded','false')}});$('#newsletter').addEventListener('submit',e=>{e.preventDefault();let email=e.target.querySelector('input').value.trim(),list=[];try{list=JSON.parse(localStorage.getItem('rehanaNewsletter')||'[]')}catch{};if(!list.includes(email))list.push(email);localStorage.setItem('rehanaNewsletter',JSON.stringify(list));toast('تم تسجيل بريدك الإلكتروني بنجاح.');e.target.reset()});
